<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>sw · {{.Name}}</title>
<link rel="icon" href="/static/logo.svg">
<link rel="stylesheet" href="/static/style.css">
<link id="theme" rel="stylesheet" href="/theme/monokai.css">
<script>
// Preferences are global (one file for every project/port, served by the
// server) and inlined here so they apply before first paint.
const prefs = Object.assign({ theme: 'monokai', font: '', size: 13, sidebar: true }, {{.Prefs}});
function applyPrefs() {
  document.getElementById('theme').href = '/theme/' + prefs.theme + '.css';
  const r = document.documentElement;
  r.style.setProperty('--font', prefs.font ? '"' + prefs.font + '", ' : '');
  r.style.setProperty('--size', prefs.size + 'px');
  r.classList.toggle('nosidebar', !prefs.sidebar);
}
function setPref(k, v) {
  prefs[k] = v; applyPrefs();
  fetch('/prefs', { method: 'PUT', body: JSON.stringify(prefs) });
}
applyPrefs();
</script>
<script src="/static/htmx.min.js"></script>
<script src="/static/sse.js"></script>
</head>
<body hx-ext="sse" sse-connect="/events" hx-trigger="sse:boot">
<header>
  <a class="logo" href="/" title="snapwatch"><img src="/static/logo.svg" alt=""> snapwatch</a>
  <button onclick="setPref('sidebar', !prefs.sidebar)" title="Toggle history (h)">☰</button>
  <button id="back" onclick="hideView()">← Esc or click to go back to the feed</button>
  <span title="{{.Dir}}"><bdi dir="ltr">{{.Dir}}</bdi></span>
  <button onclick="settings.showModal()" title="Settings">⚙</button>
</header>
<div class="split">
  <aside>
    <div class="tools"><span>History</span>
      <button onclick="hist.querySelectorAll('details[data-key]:not([data-key=wt])').forEach(d => d.open = false)" title="Collapse all commits">⊟ collapse all</button></div>
    <div id="history"></div>
  </aside>
  <main id="feed">
    {{if not .Sections}}<p class="empty">Waiting for the first change…</p>{{end}}
    {{template "feed.html" .}}
  </main>
  <main id="view"></main>
</div>
<!-- sibling, not ancestor: keeps hx-vals from leaking into the feed's own requests -->
<div hx-get="/history" hx-vals="js:{n: hist.querySelectorAll('details[data-key]').length}"
     hx-trigger="load, sse:snapshot" hx-target="#history"></div>
<div hx-get="/feed" hx-vals="js:{after: latest()}" hx-trigger="sse:snapshot"
     hx-target="#feed" hx-swap="afterbegin"></div>

<div id="tip" popover="manual"><b></b><pre></pre><small></small></div>

<dialog id="settings">
  <form method="dialog">
    <label>Theme
      <select oninput="setPref('theme', this.value)">
        {{range .Themes}}<option>{{.}}</option>{{end}}
      </select>
    </label>
    <label>Font
      <input list="fonts" placeholder="system monospace" onfocus="loadFonts()" oninput="setPref('font', this.value.trim())">
      <datalist id="fonts"></datalist>
    </label>
    <label>Size
      <input type="number" min="8" max="32" oninput="setPref('size', +this.value || 13)">
    </label>
    <button>Close</button>
  </form>
</dialog>
<script>
function latest() { const s = document.querySelector('#feed section'); return s ? s.dataset.sha : ''; }
// file view over the feed: shown when #view receives content, hidden with Esc / the back button
// The URL mirrors the view (/?rev=…&path=…) so a reload or a shared link lands on the same file.
function hideView() { document.documentElement.classList.remove('viewing'); history.replaceState(null, '', '/'); }
view.addEventListener('htmx:afterSwap', e => {
  document.documentElement.classList.add('viewing'); view.scrollTop = 0;
  history.replaceState(null, '', '/' + e.detail.pathInfo.requestPath.slice('/file'.length));
});
if (new URLSearchParams(location.search).has('path')) htmx.ajax('GET', '/file' + location.search, '#view');
document.addEventListener('keydown', e => {
  if (e.target.matches('input, select') || settings.open) return;
  if (e.key === 'Escape') hideView();
  if (e.key === 'h') setPref('sidebar', !prefs.sidebar);
});
const hist = document.getElementById('history');
// commit tooltip: one popover, filled from the hovered summary's data attributes.
// It stays open while the mouse is over the summary or the tooltip itself, so
// long messages can be scrolled; hiding is delayed to survive the gap between them.
let tipTimer;
function hideTip() {
  tipTimer = setTimeout(() => { tip.hidePopover(); hist.querySelector('.tipped')?.classList.remove('tipped'); }, 200);
}
hist.addEventListener('mouseover', e => {
  const s = e.target.closest('summary.commit');
  if (!s || s.contains(e.relatedTarget)) return;
  clearTimeout(tipTimer);
  hist.querySelector('.tipped')?.classList.remove('tipped');
  s.classList.add('tipped'); // the header this tooltip belongs to
  tip.querySelector('b').textContent = s.dataset.subject;
  tip.querySelector('pre').textContent = s.dataset.body.length > 5000 ? s.dataset.body.slice(0, 5000) + '…' : s.dataset.body;
  tip.querySelector('pre').hidden = !s.dataset.body;
  tip.querySelector('small').textContent = s.dataset.meta;
  const r = s.getBoundingClientRect();
  tip.showPopover(); // show first: its size is needed to keep it on screen
  tip.style.left = Math.max(8, Math.min(r.right + 4, innerWidth - tip.offsetWidth - 8)) + 'px';
  tip.style.top = Math.max(8, Math.min(r.top, innerHeight - tip.offsetHeight - 8)) + 'px';
});
hist.addEventListener('mouseout', e => {
  const s = e.target.closest('summary.commit');
  if (s && !s.contains(e.relatedTarget)) hideTip();
});
tip.addEventListener('mouseenter', () => clearTimeout(tipTimer));
tip.addEventListener('mouseleave', hideTip);
// keep the accordion state when the history refreshes after a snapshot
hist.addEventListener('htmx:beforeSwap', () => {
  if (hist.children.length) hist.dataset.open = JSON.stringify([...hist.querySelectorAll('details[data-key][open]')].map(d => d.dataset.key));
});
hist.addEventListener('htmx:afterSwap', () => {
  if (!hist.dataset.open) return;
  const open = new Set(JSON.parse(hist.dataset.open));
  hist.querySelectorAll('details[data-key]').forEach(d => d.open = open.has(d.dataset.key));
});
// server restarted (new boot id) → reload so templates/static are fresh
document.body.addEventListener('sse:boot', e => { if (e.detail.data !== '{{.Boot}}') location.reload(); });
// replace the datalist with installed fonts (Chromium only, asks permission once)
async function loadFonts() {
  if (!window.queryLocalFonts || fonts.dataset.loaded) return;
  try {
    const names = [...new Set((await queryLocalFonts()).map(f => f.family))].sort();
    fonts.replaceChildren(...names.map(n => Object.assign(document.createElement('option'), { value: n })));
    fonts.dataset.loaded = 1;
  } catch {} // no API or permission denied: free text only
}
// reflect stored prefs in the settings form
settings.querySelector('select').value = prefs.theme;
settings.querySelector('input[list]').value = prefs.font;
settings.querySelector('input[type=number]').value = prefs.size;
</script>
</body>
</html>
